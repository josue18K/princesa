<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fbf1e6">
  <title>Para mi princesa favorita</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <svg class="definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="gold" x2="0.9" y2="1">
        <stop stop-color="#a77946"/><stop offset=".45" stop-color="#ffe9b9"/><stop offset="1" stop-color="#a77946"/>
      </linearGradient>
      <linearGradient id="petal" x2=".8" y2="1">
        <stop stop-color="#fffaf8"/><stop offset=".65" stop-color="#fff5ec"/><stop offset="1" stop-color="#d8a7b1"/>
      </linearGradient>
      <symbol id="lily" viewBox="0 0 150 170">
        <path d="M125 163Q91 132 77 73M104 139Q60 141 42 114Q82 112 104 139M103 137Q105 101 133 90Q135 118 103 137" fill="#a5aa8e" stroke="#777e68" stroke-width="2"/>
        <g fill="url(#petal)" stroke="#b98192" stroke-width="1.2">
          <path d="M75 75Q49 39 64 7Q94 25 75 75Z"/>
          <path d="M75 75Q78 33 127 20Q129 63 75 75Z"/>
          <path d="M75 75Q104 52 145 72Q120 106 75 75Z"/>
          <path d="M75 75Q108 81 112 121Q78 115 75 75Z"/>
          <path d="M75 75Q67 111 28 125Q22 91 75 75Z"/>
          <path d="M75 75Q33 89 5 48Q46 34 75 75Z"/>
        </g>
        <path d="M72 76L56 50M75 73L80 45M78 75L101 58" stroke="#a77946" fill="none" stroke-width="2"/>
        <g fill="#a77946"><ellipse cx="55" cy="49" rx="3" ry="5" transform="rotate(-35 55 49)"/><ellipse cx="80" cy="45" rx="3" ry="5"/><ellipse cx="101" cy="58" rx="3" ry="5" transform="rotate(47 101 58)"/></g>
      </symbol>
      <symbol id="bouquet" viewBox="0 0 300 300">
        <g fill="none" stroke="#9b8775" stroke-width="1.2">
          <path d="M0 243Q91 207 140 69M0 221Q102 166 222 119M5 223Q96 209 209 249M19 244Q123 209 268 212M16 242Q52 143 32 59"/>
        </g>
        <g fill="#9a9e83" opacity=".8">
          <path d="M32 148Q7 128 12 93Q38 109 32 148M40 184Q65 145 101 150Q81 177 40 184M120 116Q110 78 136 53Q145 87 120 116M129 176Q137 142 179 134Q167 164 129 176M163 214Q198 182 230 195Q208 216 163 214M122 219Q155 245 185 231Q158 212 122 219M226 213Q245 179 273 181Q264 206 226 213"/>
        </g>
        <g fill="#d9a8ba" stroke="#faf0e9" stroke-width="1">
          <circle cx="29" cy="57" r="4"/><circle cx="23" cy="72" r="3"/>
          <circle cx="215" cy="120" r="4"/><circle cx="231" cy="114" r="3"/>
          <circle cx="266" cy="212" r="4"/><circle cx="281" cy="211" r="3"/>
        </g>
        <use href="#lily" x="113" y="37" width="114" height="130" transform="rotate(24 170 102)"/>
        <use href="#lily" x="12" y="45" width="166" height="188" transform="rotate(-22 95 139)"/>
        <use href="#lily" x="119" y="148" width="110" height="124" transform="rotate(54 174 210)"/>
      </symbol>
    </defs>
  </svg>
  <div id="ambient-petals" aria-hidden="true"></div>
  <div id="petals" aria-hidden="true"></div>
  <button class="motion-control" id="motion-control" type="button" hidden>Activar animaciones</button>
  <main>
    <section class="cover" id="cover" aria-labelledby="cover-title">
      <h1 id="cover-title">Para mi princesa favorita</h1>
      <button class="gift" id="open-gift" type="button">
        <svg class="cover-flowers cover-flowers-left" viewBox="0 0 300 300" aria-hidden="true"><use href="#bouquet"/></svg>
        <svg class="cover-flowers cover-flowers-right" viewBox="0 0 300 300" aria-hidden="true"><use href="#bouquet"/></svg>
        <span class="envelope" aria-hidden="true">
          <span class="envelope-paper"></span><span class="envelope-front"></span><span class="envelope-flap"></span>
          <span class="seal"><svg viewBox="0 0 150 170"><use href="#lily"/></svg></span>
        </span>
        <span class="button">Abrir mi regalo</span>
      </button>
    </section>

    <article class="card" id="card" aria-labelledby="card-title" hidden>
      <div class="bloom bloom-top">
        <svg role="img" aria-label="Ramo ilustrado de lirios perlados y hojas verdes" viewBox="0 0 300 300"><use href="#bouquet"/></svg>
        <img hidden alt="Acuarela botánica de un lirio blanco con hojas verdes" width="250" height="333">
      </div>
      <div class="bloom bloom-bottom" aria-hidden="true">
        <svg viewBox="0 0 300 300"><use href="#bouquet"/></svg>
        <img hidden alt="Acuarela botánica de un lirio blanco con hojas verdes" width="250" height="333">
      </div>

      <header class="dedication">
      <div class="tiara">
        <svg viewBox="0 0 240 112" role="img" aria-label="Tiara de filigrana dorada con una gema rosa">
          <g stroke="#aa7848" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
            <path id="crown" d="M28 88Q12 80 18 54Q39 53 54 71Q39 41 62 31Q85 41 89 67Q88 28 120 11Q152 28 151 67Q155 41 178 31Q201 41 186 71Q201 53 222 54Q228 80 212 88M27 88Q120 70 213 88L207 99Q120 87 33 99Z"/>
            <use href="#crown" stroke="url(#gold)" stroke-width="3"/>
          </g>
          <g fill="#f4d8de" stroke="#a77946" stroke-width="1.5">
            <path d="M120 29L133 50L120 68L107 50Z"/>
            <path d="M120 29V68M107 50H133" fill="none" stroke="#fffaf8"/>
            <circle cx="62" cy="31" r="4"/><circle cx="178" cy="31" r="4"/><circle cx="120" cy="11" r="5"/>
          </g>
        </svg>
        <span class="spark spark-left" aria-hidden="true"></span>
        <span class="spark spark-right" aria-hidden="true"></span>
        <span class="spark spark-top" aria-hidden="true"></span>
      </div>

      <h2 id="card-title" tabindex="-1"></h2>
      <div class="flourish" aria-hidden="true"><span></span></div>
      </header>
      <div class="letter">
      <div id="message" class="message"></div>
      <p id="signature" class="signature"></p>
      </div>

      <div class="music">
        <div class="music-pill">
          <span aria-hidden="true">♪</span>
          <span>MUUUUUUUUAK</span>
          <button id="toggle-music" type="button" hidden>Pausar</button>
        </div>
        <p class="music-status" id="music-status" role="status"></p>
        <div id="video" hidden></div>
        <a class="song-link" id="song-link" target="_blank" rel="noopener noreferrer" hidden>Escucha tu canción <span aria-hidden="true">↗</span><span class="sr-only"> (abre otra pestaña)</span></a>
      </div>

      <button class="button surprise" id="surprise" type="button" aria-expanded="false" aria-controls="surprise-note"><span aria-hidden="true">♡</span> <span id="surprise-label">Un último detalle</span></button>
      <div id="surprise-note" class="surprise-note" role="status" hidden>
        <svg viewBox="0 0 150 170" aria-hidden="true"><use href="#lily"/></svg>
        <p>Te mando un abrazo de esos que duran un poquito más.</p>
        <a class="song-link final-song" id="final-song" target="_blank" rel="noopener noreferrer">Mi princesa eres tú <span aria-hidden="true">↗</span><span class="sr-only"> (abre otra pestaña)</span></a>
      </div>
    </article>
    <noscript>Activa JavaScript para abrir tu regalo.</noscript>
  </main>
</body>
</html>
